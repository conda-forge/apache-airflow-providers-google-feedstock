schema_version: 1

context:
  name: apache-airflow-providers-google
  version: "22.8.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/apache_airflow_providers_google-${{ version }}.tar.gz
  sha256: 654006dc73478b36f9e4bda0f00e45ba4b864f68da66653fbc77a9ece460a79d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core ==4.1.0
  run:
    - python >=${{ python_min }}
    - apache-airflow >=2.11.0

    - apache-airflow-providers-common-compat >=1.13.0
    - apache-airflow-providers-common-sql >=1.32.0
    # tightest of upstream's floors (python >=3.14)
    - asgiref >=3.11.1
    - dill >=0.2.3
    - gcloud-aio-auth >=5.2.0
    - gcloud-aio-bigquery >=6.1.2
    - gcloud-aio-storage >=9.0.0
    - gcsfs >=2023.10.0
    - google-ads >=26.0.0,!=28.0.0.post2
    - google-analytics-admin >=0.9.0
    - google-api-core >=2.30.3
    - google-api-python-client >=2.193.0
    - google-auth >=2.29.0
    - google-auth-httplib2 >=0.0.1
    - google-genai >=2.8.0
    - google-cloud-aiplatform >=1.164.0
    # start google-cloud-aiplatform[evaluation]
    - tqdm >=4.23.0
    - scikit-learn
    - jsonschema
    - ruamel.yaml
    - pyyaml
    - litellm >=1.98.0
    # end google-cloud-aiplatform[evaluation]

    # tightest of upstream's floors (python >=3.14,<3.15)
    - ray-default >=2.55.0
    - google-cloud-bigquery-storage >=2.37.0
    - google-cloud-alloydb >=0.9.0
    - google-cloud-automl >=2.19.0
    - google-cloud-bigquery-core >=3.41.0
    - google-cloud-bigquery-datatransfer >=3.22.0
    - google-cloud-bigtable >=2.35.0
    - google-cloud-build >=3.36.0
    - google-cloud-compute >=1.47.0
    - google-cloud-container >=2.64.0
    - google-cloud-datacatalog >=3.30.0
    - google-cloud-dataflow-client >=0.12.0
    - google-cloud-dataform >=0.10.0
    - google-cloud-dataplex >=2.18.0
    - google-cloud-dataproc >=5.27.0
    - google-cloud-dataproc-metastore >=1.22.0
    - google-cloud-dlp >=3.35.0
    - google-cloud-kms >=3.12.0
    - google-cloud-language >=2.20.0
    - google-cloud-logging >=3.15.0
    - google-cloud-managedkafka >=0.4.0
    - google-cloud-memcache >=1.15.0
    - google-cloud-monitoring >=2.30.0
    - google-cloud-orchestration-airflow >=1.20.0
    - google-cloud-os-login >=2.20.0
    - google-cloud-pubsub >=2.36.0
    - google-cloud-redis >=2.21.0
    - google-cloud-secret-manager >=2.27.0
    - google-cloud-spanner >=3.63.0
    - google-cloud-speech >=2.38.0
    - google-cloud-storage >=3.10.1
    - google-cloud-storage-transfer >=1.20.0
    - google-cloud-tasks >=2.22.0
    - google-cloud-texttospeech >=2.35.0
    - google-cloud-translate >=3.25.0
    - google-cloud-videointelligence >=2.19.0
    - google-cloud-vision >=3.13.0
    - google-cloud-workflows >=1.21.0
    - google-cloud-run >=0.16.0
    - google-cloud-batch >=0.21.0
    - grpcio-gcp >=0.2.2
    - httpx2 >=2.0.0
    - looker-sdk >=22.4.0,!=24.18.0
    - pandas-gbq >=0.7.0
    # tightest of upstream's floors (python >=3.14)
    - pandas >=2.3.3
    - proto-plus >=1.26.0
    # tightest of upstream's floors (python >=3.14)
    - pyarrow >=22.0.0
    # tightest of upstream's floors (python >=3.14)
    - pydantic >=2.13.1
    - python-slugify >=7.0.0
    - sqlalchemy-bigquery >=1.2.1
    - sqlalchemy-spanner >=1.6.2
    - tenacity >=8.3.0
    - immutabledict >=4.2.0
    - types-protobuf >=5.27.0,!=5.29.1.20250402

tests:
  - python:
      imports:
        - airflow.providers.google
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Provider package apache-airflow-providers-google for Apache Airflow
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  homepage: https://github.com/apache/airflow/
  repository: https://github.com/apache/airflow/
  documentation: https://airflow.apache.org/docs/apache-airflow-providers-google/stable/index.html

extra:
  recipe-maintainers:
    - xylar
